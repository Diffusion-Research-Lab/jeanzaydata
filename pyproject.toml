[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jeanzaydata"
version = "0.1.0"
description = "Dataset staging and loading utilities for the Jean Zay supercomputer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10",
  "scikit-learn>=1.3",
  "torch>=2.7",
]

[project.optional-dependencies]
dev = [
  "flake8>=7.0",
  "pytest>=8.2.1",
  "pytest-cov>=5.0",
]

[project.scripts]
jeanzaydata = "jeanzaydata._prepare:run_cli"

[project.urls]
Repository = "https://github.com/Diffusion-Research-Lab/jeanzaydata"

[tool.setuptools]
packages = ["jeanzaydata"]
include-package-data = false

[tool.setuptools.package-data]
jeanzaydata = ["resources/imagenet_lt/annotations/*.txt"]

[tool.pytest.ini_options]
testpaths = ["jeanzaydata/tests"]

[tool.coverage.run]
source = ["jeanzaydata"]
omit = ["jeanzaydata/tests/*"]

[tool.coverage.report]
omit = ["jeanzaydata/tests/*"]
